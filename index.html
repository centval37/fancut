<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131110">
<title>Fancut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
/* Layout: a quiet home with three choices; the editor opens as a full-screen dark workspace. */
:root{
  --bg:#f4f2ef; --panel:#ffffff; --fg:#1d1a17; --muted:#6f685f; --line:#e3ded7;
  --tally:#d4361f; --tally-ink:#ffffff; --wave:#a59a8e; --wave-on:#d4361f;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131110; --panel:#1d1a17; --fg:#f2eee8; --muted:#a39a8f; --line:#302b26;
  --tally:#ff5a3c; --tally-ink:#140a07; --wave:#665d54; --wave-on:#ff5a3c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.screen{display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.025em;margin:0;line-height:1.1}
h2{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--tally);margin-right:10px;vertical-align:.2em}
.sub{color:var(--muted);margin:0}
.choices{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);text-align:left;cursor:pointer;font:inherit}
.choice b{display:block;font-family:var(--display);font-weight:600;font-size:1.25rem}
.choice span{color:var(--muted);font-size:.9rem}
.choice i{font-style:normal;color:var(--tally);font-size:1.4rem}
.back{align-self:flex-start;border:0;background:none;color:var(--muted);font:500 .95rem var(--body);padding:4px 0;cursor:pointer}
textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:12px 14px;font:1rem/1.6 var(--body);min-height:220px;resize:vertical}
textarea:focus,input:focus-visible,button:focus-visible{outline:2px solid var(--tally);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctl{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
.ctl span{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.ctl b{font-family:var(--mono);font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--tally)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 .95rem var(--body);padding:12px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--tally);border-color:var(--tally);color:var(--tally-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.full{width:100%}
.meta{font-size:.85rem;color:var(--muted);margin:0}
.meta b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{accent-color:var(--tally);width:18px;height:18px}
.pick{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;background:var(--panel);display:flex;flex-direction:column;gap:8px;align-items:center}
.wavebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
#wave{width:100%;height:96px;display:block}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--tally)}
.panel{display:flex;flex-direction:column;gap:12px}

/* Teleprompter stage */
.stage{position:fixed;inset:0;background:#0d0c0b;color:#f5f2ec;z-index:50;display:flex;flex-direction:column}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.stage .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.72),rgba(0,0,0,.5) 55%,rgba(0,0,0,.15))}
.viewport{position:relative;flex:1;overflow:hidden}
.scroll{position:absolute;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));top:0;font-family:var(--display);font-weight:600;line-height:1.35;white-space:pre-wrap;will-change:transform}
.guide{position:absolute;left:0;right:0;top:22%;height:2px;background:#ff5a3c;opacity:.7}
.topbar,.stagebar{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;font-family:var(--mono);font-size:.85rem}
.stagebar{padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.6)}
.stagebar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.stagebar .btn.rec{background:#d4361f;border-color:#d4361f}
.recdot i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4a2e;margin-right:6px}
.count{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 24px;font-family:var(--display);font-weight:800;font-size:7rem;color:#fff;pointer-events:none}
.count.msg{font-size:1.1rem}

/* ---------- Editor workspace (always dark, like a studio) ---------- */
.ed{--e-bg:#0d0c0b;--e-panel:#1a1816;--e-line:#2c2925;--e-fg:#f2eee8;--e-muted:#a39a8f;--e-acc:#ff5a3c;
  position:fixed;inset:0;z-index:40;background:var(--e-bg);color:var(--e-fg);display:flex;flex-direction:column;font-family:var(--body);color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.ed-top .lnk{border:0;background:none;color:var(--e-muted);font:500 15px var(--body);min-height:40px;padding:0 4px;cursor:pointer}
.ed-top .chip{border:1px solid var(--e-line);background:var(--e-panel);color:var(--e-fg);font:600 13px var(--mono);border-radius:999px;padding:6px 12px;cursor:pointer}
.ed-top .go{border:0;background:var(--e-acc);color:#140a07;font:600 14px var(--body);border-radius:999px;padding:9px 18px;cursor:pointer}
.ed-top .go:disabled{opacity:.4}
.pv{flex:1;min-height:0;display:grid;place-items:center;padding:4px 12px;position:relative;overflow:hidden}
.pv canvas{background:#000;border-radius:6px;touch-action:none;display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.empty div{display:flex;flex-direction:column;gap:12px;align-items:center;pointer-events:auto}
.empty button{border:0;background:var(--e-acc);color:#140a07;font:600 16px var(--body);border-radius:14px;padding:16px 24px;cursor:pointer}
.empty p{margin:0;color:var(--e-muted);font-size:14px}
.transport{display:flex;justify-content:space-between;align-items:center;padding:6px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.transport .tc{font:500 12px var(--mono);color:var(--e-muted);font-variant-numeric:tabular-nums;min-width:110px}
.transport .tc b{color:var(--e-fg);font-weight:500}
.playbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--e-fg);color:var(--e-bg);display:grid;place-items:center;cursor:pointer}
.tbtns{display:flex;gap:4px;min-width:110px;justify-content:flex-end}
.ib{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--e-fg);display:grid;place-items:center;cursor:pointer}
.ib:disabled{opacity:.3}
.tlwrap{position:relative;background:#121110;border-top:1px solid var(--e-line);border-bottom:1px solid var(--e-line)}
.tl{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tl::-webkit-scrollbar{display:none}
.tlin{position:relative;padding:4px 0 10px}
.ruler{position:relative;height:20px}
.ruler span{position:absolute;top:2px;font:500 10px var(--mono);color:var(--e-muted);transform:translateX(-50%)}
.ruler i{position:absolute;bottom:0;width:1px;height:5px;background:#3a3530}
.trow{position:relative;margin-top:4px}
.clip{position:absolute;top:0;bottom:0;border-radius:6px;overflow:hidden;display:flex;align-items:center;padding:0 8px;font:600 11px var(--body);white-space:nowrap;color:#fff;cursor:pointer;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.clip.main{background:#2d3b48}
.clip.main.img{background:#3b3448}
.clip.ov{background:#5a3f1d;color:#ffd99a}
.clip.tx{background:#3a3631;color:#f2eee8}
.clip.au{background:#1f3a29;color:#9fe0ad}
.clip .nm{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip.sel{outline:2px solid #fff;outline-offset:-2px;touch-action:none;z-index:2;overflow:visible}
.clip.main.sel{touch-action:pan-x}
.clip .h{position:absolute;top:0;bottom:0;width:18px;background:#fff;display:none;touch-action:none}
.clip.sel .h{display:block}
.clip .h.l{left:-2px;border-radius:6px 0 0 6px}
.clip .h.r{right:-2px;border-radius:0 6px 6px 0}
.clip .h::after{content:"";position:absolute;left:8px;top:30%;bottom:30%;width:2px;background:#0d0c0b;border-radius:1px}
.addend{position:absolute;top:0;width:44px;height:100%;border-radius:8px;border:1px dashed #4a443d;background:none;color:var(--e-fg);font-size:22px;cursor:pointer}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:3}
.playhead::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:#fff}
.zoom{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:2px;display:flex;gap:2px;z-index:4}
.zoom button{width:26px;height:22px;border-radius:6px;border:1px solid var(--e-line);background:#1a1816;color:var(--e-muted);font:600 13px var(--mono);cursor:pointer}
.tools{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:8px max(6px,env(safe-area-inset-right,0px)) 10px max(6px,env(safe-area-inset-left,0px));background:#171513}
.tool{border:0;background:none;color:var(--e-fg);font:500 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;cursor:pointer}
.tool svg{width:22px;height:22px}
.tool.acc{color:var(--e-acc)}
.tool:disabled{opacity:.3}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--e-panel);border-top:1px solid var(--e-line);border-radius:18px 18px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:62%;overflow-y:auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.sheet .hd b{font-family:var(--display);font-weight:600;font-size:18px}
.sheet .done{border:0;background:var(--e-fg);color:var(--e-bg);font:600 14px var(--body);border-radius:999px;padding:8px 16px;cursor:pointer}
.sheet .ctl span{color:var(--e-muted)}
.sheet .ctl b{color:var(--e-fg)}
.sheet input[type=text]{width:100%;border:1px solid var(--e-line);background:#121110;color:var(--e-fg);border-radius:12px;padding:12px 14px;font:16px var(--body)}
.sheet input[type=range]{accent-color:var(--e-acc)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--e-line);background:#121110;color:var(--e-fg);font:500 13px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.pills button[aria-pressed="true"]{border-color:var(--e-acc);color:var(--e-acc)}
.sheet .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--e-muted);font-weight:600}
.sheet .row2{display:flex;gap:8px}
.sheet .row2 button{flex:1;border:1px solid var(--e-line);background:#121110;color:var(--e-fg);font:600 13px var(--body);padding:10px;border-radius:10px;cursor:pointer}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:#f2eee8;color:#0d0c0b;font:600 13px var(--body);padding:8px 14px;border-radius:999px;z-index:30;pointer-events:none;max-width:90%;text-align:center}
.exp{position:absolute;inset:0;z-index:30;background:rgba(13,12,11,.92);display:grid;place-items:center;padding:24px}
.exp div{display:flex;flex-direction:column;gap:14px;width:min(320px,100%);text-align:center}
.exp b{font-family:var(--display);font-size:22px}
.exp .bar{background:#2c2925}
.exp .bar i{background:var(--e-acc)}
.exp p{margin:0;color:var(--e-muted);font-size:14px}
.exp button{border:1px solid var(--e-line);background:none;color:var(--e-fg);font:600 14px var(--body);padding:10px;border-radius:12px;cursor:pointer}
.topmid{display:flex;gap:6px}
.clip.th{background-size:auto 100%;background-repeat:repeat-x;background-position:left center}
.clip.th .nm{text-shadow:0 1px 3px #000,0 0 2px #000}
.clip .fd{position:absolute;top:0;bottom:0;width:14px;pointer-events:none}
.clip .fd.l{left:0;background:linear-gradient(90deg,rgba(0,0,0,.7),transparent)}
.clip .fd.r{right:0;background:linear-gradient(270deg,rgba(0,0,0,.7),transparent)}
.sheet .hint{margin:0;color:var(--e-muted);font-size:13px}
.sheet .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#121110;padding:4px;border-radius:12px}
.sheet .seg button{border:0;background:none;color:var(--e-muted);font:600 13px var(--body);padding:8px;border-radius:9px;cursor:pointer}
.sheet .seg button[aria-pressed="true"]{background:#2c2925;color:var(--e-fg)}
.sheet .tab{display:flex;flex-direction:column;gap:12px}
.big{display:flex;flex-direction:column;gap:8px}
.big button{border:1px solid var(--e-line);background:#121110;color:var(--e-fg);text-align:left;padding:14px 16px;border-radius:14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;font-family:var(--body)}
.big b{font-size:15px}.big span{font-size:13px;color:var(--e-muted)}
.recbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.recbtn{width:76px;height:76px;border-radius:50%;border:4px solid var(--e-fg);background:none;display:grid;place-items:center;cursor:pointer}
.recbtn i{width:52px;height:52px;border-radius:50%;background:#ff3b30;transition:all .2s}
.recbtn.on i{width:28px;height:28px;border-radius:6px}
#recTime{font:500 16px var(--mono);font-variant-numeric:tabular-nums}
.sfx{display:flex;flex-direction:column}
.sfxrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--e-line)}
.sfxrow div{flex:1;display:flex;flex-direction:column;min-width:0}
.sfxrow b{font-size:14px}.sfxrow span{font:500 12px var(--mono);color:var(--e-muted)}
.pbtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--e-line);background:#121110;color:var(--e-fg);display:grid;place-items:center;cursor:pointer}
.addb{border:0;background:var(--e-fg);color:var(--e-bg);font:600 13px var(--body);border-radius:999px;padding:8px 14px;cursor:pointer}
@media (prefers-reduced-motion: reduce){.recbtn i{transition:none}}
.mediabin{position:fixed;left:-10px;top:-10px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="wrap" id="app">

  <!-- Home -->
  <div class="screen" id="home">
    <h1><span class="dot" aria-hidden="true"></span>Fancut</h1>
    <p class="sub">What are you making today?</p>
    <div class="choices">
      <button class="choice" data-go="prompt"><div><b>Record with script</b><span>Read your words while you film</span></div><i aria-hidden="true">›</i></button>
      <button class="choice" data-go="edit"><div><b>Edit a video</b><span>Layers for clips, text, overlays and sound</span></div><i aria-hidden="true">›</i></button>
      <button class="choice" data-go="audio"><div><b>Get the audio</b><span>Turn a video into an MP3</span></div><i aria-hidden="true">›</i></button>
    </div>
  </div>

  <!-- Teleprompter -->
  <div class="screen" id="prompt" hidden>
    <button class="back" data-go="home">‹ Back</button>
    <h2>Record with script</h2>
    <textarea id="script" aria-label="Your script">The call came in at 2:14 a.m. A woman's voice, calm. Too calm.

"Someone has been inside my house," she said. "Everything is exactly where I left it. Except one thing."

Officers arrived eleven minutes later. The front door was locked. The windows were shut. And on the kitchen table sat a photograph she had never seen before.

It was a picture of her. Sleeping.

Let's begin.</textarea>
    <p class="meta" id="wordInfo"></p>
    <div class="row">
      <div class="ctl"><span>Speed <b id="spdV"></b></span><input id="spd" type="range" min="20" max="160" value="55"></div>
      <div class="ctl"><span>Text size <b id="sizeV"></b></span><input id="size" type="range" min="22" max="64" value="34"></div>
    </div>
    <button class="btn primary full" id="startP">Start</button>
  </div>

  <!-- Audio -->
  <div class="screen" id="audio" hidden>
    <button class="back" data-go="home">‹ Back</button>
    <h2>Get the audio</h2>
    <div class="pick"><p class="meta">Pick a video. It stays on your phone.</p><input id="vid" type="file" accept="video/*,audio/*"></div>
    <div id="aWork" class="panel" hidden>
      <div class="wavebox"><canvas id="wave" width="1000" height="192"></canvas>
        <div class="times"><span id="tStart">0:00</span><span id="tLen"></span><span id="tEnd">0:00</span></div></div>
      <div class="row">
        <div class="ctl"><span>Cut from start <b id="cutSV">0.0s</b></span><input id="cutS" type="range" min="0" max="1000" value="0"></div>
        <div class="ctl"><span>Cut from end <b id="cutEV">0.0s</b></span><input id="cutE" type="range" min="0" max="1000" value="0"></div>
      </div>
      <label class="check"><input id="norm" type="checkbox" checked> Make it louder</label>
      <div class="row"><button class="btn" id="play">Play</button><button class="btn primary" id="export" style="flex:1">Save as MP3</button></div>
      <div class="bar" hidden id="barBox"><i id="bar"></i></div>
      <p class="meta" id="status"></p>
    </div>
  </div>
</div>

<!-- Editor -->
<div class="ed" id="edit" hidden>
  <div class="ed-top">
    <button class="lnk" data-go="home">‹ Home</button>
    <div class="topmid"><button class="chip" id="shapeBtn" aria-label="Video shape">9:16</button><button class="chip" id="newBtn">New</button></div>
    <button class="go" id="expBtn" disabled>Export</button>
  </div>
  <div class="pv" id="pv">
    <canvas id="cv" width="720" height="1280"></canvas>
    <div class="empty" id="empty"><div><button id="firstAdd">+ Add your first clip</button><p>Videos or photos from your phone</p></div></div>
  </div>
  <div class="transport">
    <span class="tc" id="tc"><b>0:00.0</b> / 0:00.0</span>
    <button class="playbtn" id="edPlay" aria-label="Play"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M7 4v16l13-8z"></path></svg></button>
    <div class="tbtns">
      <button class="ib" id="undoBtn" aria-label="Undo" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
      <button class="ib" id="redoBtn" aria-label="Redo" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
    </div>
  </div>
  <div class="tlwrap">
    <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zIn" aria-label="Zoom in">+</button></div>
    <div class="tl" id="tl"><div class="tlin" id="tlin"></div></div>
    <div class="playhead"></div>
  </div>
  <div class="tools" id="tools"></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="exp" id="expBox" hidden><div><b>Exporting</b><div class="bar"><i id="expBar"></i></div><p id="expMsg">Keep this screen open. It takes as long as the video.</p><button id="expCancel">Cancel</button></div></div>
  <input type="file" id="fMain" accept="video/*,image/*" multiple hidden>
  <input type="file" id="fOv" accept="video/*,image/*" hidden>
  <input type="file" id="fAu" accept="audio/*,video/*" hidden>
</div>
<div class="mediabin" id="bin"></div>

<div class="stage" id="stage" hidden>
  <video id="cam" playsinline muted hidden></video>
  <div class="shade"></div>
  <div class="topbar"><span id="clock">0:00</span><span class="recdot" id="recInd" hidden><i></i>REC</span></div>
  <div class="viewport" id="vp"><div class="guide"></div><div class="scroll" id="roll"></div><div class="count" id="count" hidden></div></div>
  <div class="stagebar"><button class="btn" id="slower">Slower</button><button class="btn rec" id="stopP">Stop</button><button class="btn" id="faster">Faster</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,s||0);const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')};
const fmt1=s=>{s=Math.max(0,s||0);const m=Math.floor(s/60),x=s-m*60;return m+':'+(x<10?'0':'')+x.toFixed(1)};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const tick0=()=>new Promise(r=>setTimeout(r,0));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* Navigation */
function go(to){['home','prompt','audio'].forEach(s=>$(s).hidden=s!==to);$('app').hidden=to==='edit';$('edit').hidden=to!=='edit';
  if(to==='edit'){requestAnimationFrame(()=>{fitCanvas();fitTimeline();renderTimeline();draw();openEditor()})}else{pause()} scrollTo(0,0)}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

/* Saving: share sheet on phones, then a download link */
async function deliver(blob,name){
  const file=new File([blob],name,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return 'shared'}}catch(e){if(e.name==='AbortError')return 'cancelled'}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return 'downloaded';
}
const doneMsg={shared:'Done. Choose "Save Video" or "Save to Files" to keep it.',downloaded:'Done. Check your Downloads.',cancelled:'Not saved. Tap the button to try again.'};
const bestType=()=>window.MediaRecorder?(['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||''):'';

/* ---------- Teleprompter ---------- */
const savedScript=store.get('fc-script');if(savedScript)$('script').value=savedScript;
function info(){const w=$('script').value.trim().split(/\s+/).filter(Boolean).length;
  $('wordInfo').innerHTML=`<b>${w}</b> words · about <b>${fmt(w/150*60)}</b> to read`;
  $('spdV').textContent=$('spd').value;$('sizeV').textContent=$('size').value+'px';store.set('fc-script',$('script').value)}
['script','spd','size'].forEach(i=>$(i).addEventListener('input',info));info();
let praf=0,py=0,plast=0,ppaused=false,rec=null,chunks=[],camStream=null,elapsed=0;
function showMsg(t){const c=$('count');c.className='count msg';c.textContent=t;c.hidden=false;setTimeout(()=>{c.hidden=true;c.className='count'},2200)}
function countdown(){return new Promise(r=>{let n=3;const c=$('count');c.className='count';c.hidden=false;c.textContent=n;const iv=setInterval(()=>{n--;if(!n){clearInterval(iv);c.hidden=true;r()}else c.textContent=n},800)})}
$('startP').onclick=async()=>{
  const roll=$('roll');roll.textContent=$('script').value;roll.style.fontSize=$('size').value+'px';
  $('stage').hidden=false;py=$('vp').clientHeight*0.22;elapsed=0;ppaused=true;roll.style.transform=`translateY(${py}px)`;
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920}},audio:{echoCancellation:true,noiseSuppression:true}});
    $('cam').srcObject=camStream;$('cam').hidden=false;await $('cam').play()}
  catch(e){camStream=null;showMsg('The camera is blocked. Allow camera and microphone for this site in Safari settings. The words still scroll so you can practise.');await new Promise(r=>setTimeout(r,2400))}
  await countdown();
  if(camStream&&window.MediaRecorder){const mt=bestType();rec=new MediaRecorder(camStream,mt?{mimeType:mt}:undefined);chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start(1000);$('recInd').hidden=false}
  ppaused=false;plast=performance.now();praf=requestAnimationFrame(rollStep);
};
function rollStep(now){const dt=(now-plast)/1000;plast=now;if(!ppaused){py-=dt*Number($('spd').value);elapsed+=dt;$('clock').textContent=fmt(elapsed)}$('roll').style.transform=`translateY(${py}px)`;praf=requestAnimationFrame(rollStep)}
$('vp').onclick=()=>{ppaused=!ppaused;plast=performance.now();if(rec)ppaused?rec.pause():rec.resume()};
$('slower').onclick=()=>{$('spd').value=Math.max(20,+$('spd').value-10);info()};
$('faster').onclick=()=>{$('spd').value=Math.min(160,+$('spd').value+10);info()};
$('stopP').onclick=async()=>{
  cancelAnimationFrame(praf);
  if(rec&&rec.state!=='inactive'){await new Promise(r=>{rec.onstop=r;rec.stop()});
    const type=rec.mimeType||'video/mp4';await deliver(new Blob(chunks,{type}),`take-${Date.now()}.${type.includes('mp4')?'mp4':'webm'}`)}
  if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;rec=null;$('cam').hidden=true;$('recInd').hidden=true;$('stage').hidden=true;
};

/* =====================================================================
   Layered editor
   Tracks: text (top), overlay, main (sequential clips), audio (bottom).
   Item: {id, track, kind:'video'|'image'|'audio'|'text', start, dur, in, srcDur, speed, fi, fo, el, fk, ...}
   ===================================================================== */
const cv=$('cv'),g=cv.getContext('2d'),tl=$('tl'),tlin=$('tlin');
const SHAPES={'9:16':[720,1280],'1:1':[1080,1080],'4:5':[864,1080],'16:9':[1280,720]};
const LOOKS={normal:{n:'Normal',f:''},mystery:{n:'Dark Mystery',f:'brightness(82%) contrast(125%) saturate(65%)'},cold:{n:'Cold Case',f:'contrast(110%) saturate(45%) hue-rotate(-12deg)'},noir:{n:'Noir',f:'grayscale(100%) contrast(135%)'},warm:{n:'Warm',f:'sepia(22%) saturate(125%) brightness(104%)'},night:{n:'Night Cam',f:'grayscale(100%) sepia(100%) hue-rotate(60deg) saturate(240%) brightness(90%)'}};
const TSTYLES={classic:'Classic',box:'Black box',yellow:'Yellow',red:'Red box'};
const TANIMS={none:'None',pop:'Pop',fade:'Fade',type:'Typewriter',slide:'Slide up'};
const FX={zoom:'Slow zoom',shake:'Shake',vignette:'Dark edges',grain:'Film grain',glitch:'Glitch'};
const FITS={fill:'Fill',fit:'Fit',blur:'Blur fill'};
const SPEEDS=[0.5,0.75,1,1.5,2];
const E={items:[],shape:'9:16',t:0,playing:false,sel:null,pxs:40,undo:[],redo:[],exporting:false,recording:false};
let uid=1,actx=null,master=null,recDest=null,clock0=0,t0=0,raf=0,exportStop=null;

const mains=()=>E.items.filter(i=>i.track==='main');
function layoutMain(){let s=0;for(const it of mains()){it.start=s;s+=it.dur}}
function total(){layoutMain();let m=0;for(const i of E.items)m=Math.max(m,i.start+i.dur);return m}
const byId=id=>E.items.find(i=>i.id===id);
const activeAt=(it,t)=>t>=it.start&&t<it.start+it.dur-1e-6;
const isMedia=it=>it.kind==='video'||it.kind==='audio';
const srcPos=(it,t)=>it.in+(t-it.start)*(it.speed||1);
function fadeAmt(it,t){let a=1;const l=t-it.start,r=it.start+it.dur-t;if(it.fi>0)a=Math.min(a,l/it.fi);if(it.fo>0)a=Math.min(a,r/it.fo);return clamp(a,0,1)}

/* ---------- Saving (stays on this phone) ---------- */
const DB={db:null,
  open(){return new Promise(res=>{if(this.db)return res(this.db);try{const r=indexedDB.open('fancut',1);r.onupgradeneeded=()=>{r.result.createObjectStore('files');r.result.createObjectStore('meta')};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch(e){res(null)}})},
  req(store,mode,fn){return new Promise(res=>{if(!this.db)return res(null);try{const tx=this.db.transaction(store,mode),rq=fn(tx.objectStore(store));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>res(null)}catch(e){res(null)}})},
  put(s,k,v){return this.req(s,'readwrite',o=>o.put(v,k))},get(s,k){return this.req(s,'readonly',o=>o.get(k))},clear(s){return this.req(s,'readwrite',o=>o.clear())}};
let saveT=0,restoring=false;
function scheduleSave(){if(restoring)return;clearTimeout(saveT);saveT=setTimeout(saveProject,700)}
function saveProject(){if(E.exporting)return;const items=E.items.map(i=>{const o={};for(const k in i){if(k==='el'||k[0]==='_')continue;o[k]=i[k]}return o});
  DB.put('meta','project',{shape:E.shape,uid,items})}
function storeFile(blob){const fk='f'+Date.now()+'_'+(uid++);DB.put('files',fk,blob);return fk}
async function restoreProject(){
  await DB.open();const p=await DB.get('meta','project');if(!p||!p.items||!p.items.length)return;
  restoring=true;toast('Opening your last project…');const cache={};const kept=[];
  for(const it of p.items){
    if(it.fk){if(!(it.fk in cache)){const b=await DB.get('files',it.fk);cache[it.fk]=b?await loadMedia(b,it.kind).catch(()=>null):null}
      const m=cache[it.fk];if(!m)continue;it.el=m.el}
    kept.push(it)}
  E.items=kept;uid=Math.max(p.uid||1,...kept.map(i=>i.id+1));setShape(p.shape||'9:16',true);restoring=false;afterChange();toast('Your last project is back')}
let newArmed=0;
$('newBtn').onclick=async()=>{
  if(!E.items.length)return;
  if(Date.now()-newArmed>3000){newArmed=Date.now();toast('Tap New again to start a fresh project');return}
  pause();E.items.forEach(i=>{if(i.el&&i.el.pause)i.el.pause()});$('bin').innerHTML='';E.items=[];E.undo=[];E.redo=[];E.sel=null;E.t=0;closeSheet();
  await DB.clear('files');await DB.put('meta','project',{shape:E.shape,uid,items:[]});afterChange();toast('New project')};

/* History */
const snap=()=>E.items.map(i=>({...i}));
function pushHist(){E.undo.push(snap());if(E.undo.length>50)E.undo.shift();E.redo=[];updBtns()}
function restore(s){E.items=s.map(i=>({...i}));if(E.sel&&!byId(E.sel))E.sel=null;closeSheet();afterChange()}
$('undoBtn').onclick=()=>{if(!E.undo.length)return;E.redo.push(snap());restore(E.undo.pop())};
$('redoBtn').onclick=()=>{if(!E.redo.length)return;E.undo.push(snap());restore(E.redo.pop())};
function updBtns(){$('undoBtn').disabled=!E.undo.length;$('redoBtn').disabled=!E.redo.length;$('expBtn').disabled=!E.items.length;$('empty').hidden=!!E.items.length}
function afterChange(){E.t=clamp(E.t,0,total());renderTimeline();renderTools();syncMedia(false);draw();updBtns();scheduleSave()}

let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

/* ---------- Media ---------- */
function loadMedia(file,as){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);
  if(as==='image'){const im=new Image();im.onload=()=>{im._thumb=thumbFrom(im,im.naturalWidth,im.naturalHeight);res({el:im,dur:Infinity,w:im.naturalWidth,h:im.naturalHeight})};im.onerror=rej;im.src=url;return}
  const el=document.createElement(as==='audio'?'audio':'video');el.preload='auto';el.playsInline=true;el.setAttribute('playsinline','');
  el.onloadedmetadata=()=>{res({el,dur:el.duration,w:el.videoWidth,h:el.videoHeight});if(as==='video')makeVideoThumb(url,el)};el.onerror=()=>rej(new Error('load'));
  el.addEventListener('seeked',()=>{if(E.playing)return;if(el._want!=null&&Math.abs(el.currentTime-el._want)>0.03){try{el.currentTime=el._want}catch(e){}}else draw()});el.addEventListener('loadeddata',()=>{if(!E.playing)draw()});
  el.src=url;$('bin').appendChild(el);el.load();connectAudio(el)})}
function thumbFrom(src,w,h){try{const c=document.createElement('canvas');c.height=48;c.width=Math.max(24,Math.round(48*w/h));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}catch(e){return null}}
function makeVideoThumb(url,owner){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
  let done=false;const fin=()=>{if(done)return;done=true;v.removeAttribute('src');v.load()};setTimeout(fin,5000);
  v.onloadeddata=()=>{try{v.currentTime=Math.min(0.5,(v.duration||1)/2)}catch(e){fin()}};
  v.onseeked=()=>{owner._thumb=thumbFrom(v,v.videoWidth||16,v.videoHeight||9);fin();if(!$('edit').hidden)renderTimeline()};v.src=url}
function connectAudio(el){if(!actx||el._src||el.tagName==='IMG')return;try{el._src=actx.createMediaElementSource(el);el._gain=actx.createGain();el._src.connect(el._gain).connect(master)}catch(e){}}
function ensureAudio(){if(actx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();master=actx.createGain();master.connect(actx.destination);recDest=actx.createMediaStreamDestination();master.connect(recDest);
  E.items.forEach(i=>i.el&&connectAudio(i.el))}
const kindOf=f=>f.type.startsWith('image')?'image':f.type.startsWith('audio')?'audio':'video';
const shortName=f=>(f.name||'clip').replace(/\.[^.]+$/,'').slice(0,24);
const base=()=>({speed:1,fi:0,fo:0,in:0,start:0});

async function addMainFiles(files){
  const list=[...files];if(!list.length)return;pushHist();toast(list.length>1?`Adding ${list.length} clips…`:'Adding clip…');
  for(const f of list){const k=kindOf(f);if(k==='audio'){toast('That is an audio file. Use Audio to add sound.');continue}
    try{const m=await loadMedia(f,k);E.items.push({...base(),id:uid++,track:'main',kind:k,el:m.el,fk:storeFile(f),w:m.w,h:m.h,name:shortName(f),dur:k==='image'?3:m.dur,srcDur:m.dur,vol:1,look:'normal',br:100,ct:100,sa:100,fit:'fill',fx:{}})}
    catch(e){toast('That file could not be opened. Try another one.')}}
  afterChange();scrollToT(E.t)}
async function addOverlay(f){const k=kindOf(f);if(k==='audio'){toast('Pick a video or photo for an overlay.');return}
  try{const m=await loadMedia(f,k);pushHist();
    E.items.push({...base(),id:uid++,track:'overlay',kind:k,el:m.el,fk:storeFile(f),w:m.w,h:m.h,name:shortName(f),start:E.t,dur:k==='image'?3:m.dur,srcDur:m.dur,x:.5,y:.38,scale:.5,op:1,vol:1});
    E.sel=E.items[E.items.length-1].id;afterChange()}catch(e){toast('That file could not be opened.')}}
async function addAudio(f,name,at){try{const m=await loadMedia(f,'audio');pushHist();
    E.items.push({...base(),id:uid++,track:'audio',kind:'audio',el:m.el,fk:storeFile(f),name:name||shortName(f),start:at==null?E.t:at,dur:m.dur,srcDur:m.dur,vol:.9});
    E.sel=E.items[E.items.length-1].id;afterChange();return true}catch(e){toast('That sound could not be opened.');return false}}
function addText(){pushHist();E.items.push({...base(),id:uid++,track:'text',kind:'text',text:'Your text here',style:'classic',anim:'pop',size:7,x:.5,y:.78,start:E.t,dur:3,srcDur:Infinity});
  E.sel=E.items[E.items.length-1].id;afterChange();openSheet()}

$('fMain').onchange=e=>{addMainFiles(e.target.files);e.target.value=''};
$('fOv').onchange=e=>{if(e.target.files[0])addOverlay(e.target.files[0]);e.target.value=''};
$('fAu').onchange=e=>{if(e.target.files[0]){addAudio(e.target.files[0]);closeSheet()}e.target.value=''};
$('firstAdd').onclick=()=>$('fMain').click();

/* Shape */
function setCanvasSize(){const [w,h]=SHAPES[E.shape],q=E.exporting?1:0.6;cv.width=Math.round(w*q);cv.height=Math.round(h*q);noisePat=null}
function setShape(s,quiet){E.shape=s;$('shapeBtn').textContent=s;setCanvasSize();fitCanvas();draw();
  if(!quiet){toast({'9:16':'Vertical 9:16 · TikTok, Reels, Shorts','1:1':'Square 1:1','4:5':'Portrait 4:5 · Instagram feed','16:9':'Wide 16:9 · YouTube'}[s]);scheduleSave()}}
$('shapeBtn').onclick=()=>{const keys=Object.keys(SHAPES);setShape(keys[(keys.indexOf(E.shape)+1)%keys.length])};

/* ---------- Drawing ---------- */
const blurC=document.createElement('canvas'),bctx=blurC.getContext('2d');
const noiseC=document.createElement('canvas');noiseC.width=noiseC.height=160;
(()=>{const n=noiseC.getContext('2d'),d=n.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)})();
let noisePat=null;
function rnd(seed){const x=Math.sin(seed*12.9898)*43758.5453;return x-Math.floor(x)}
function fitCanvas(){const pv=$('pv'),aw=pv.clientWidth-24,ah=pv.clientHeight-8;if(aw<=0||ah<=0)return;const sc=Math.min(aw/cv.width,ah/cv.height);cv.style.width=Math.floor(cv.width*sc)+'px';cv.style.height=Math.floor(cv.height*sc)+'px'}
function filterFor(it){const l=LOOKS[it.look]||LOOKS.normal;let f=l.f;if(it.br!==100)f+=` brightness(${it.br}%)`;if(it.ct!==100)f+=` contrast(${it.ct}%)`;if(it.sa!==100)f+=` saturate(${it.sa}%)`;return f.trim()}
function srcSize(it){return it.kind==='image'?[it.el.naturalWidth,it.el.naturalHeight]:[it.el.videoWidth||it.w||16,it.el.videoHeight||it.h||9]}
function draw(){
  const W=cv.width,H=cv.height,t=E.t;g.filter='none';g.globalAlpha=1;g.fillStyle='#000';g.fillRect(0,0,W,H);
  let m=mains().find(i=>activeAt(i,t));if(!m&&mains().length&&t>=total()-0.05)m=mains()[mains().length-1];
  if(m)drawMain(m,t,W,H);
  for(const it of E.items){if(it.track!=='overlay'||!activeAt(it,t))continue;const [sw,sh]=srcSize(it);const w=it.scale*W,h=w*sh/sw,x=it.x*W-w/2,y=it.y*H-h/2;
    g.globalAlpha=it.op*fadeAmt(it,t);try{g.drawImage(it.el,x,y,w,h)}catch(e){}g.globalAlpha=1;it._box=[x,y,w,h];
    if(!E.exporting&&E.sel===it.id)selBox(x,y,w,h)}
  for(const it of E.items){if(it.track!=='text'||!activeAt(it,t))continue;drawText(it,W,H,t)}
  const tcs=`<b>${fmt1(t)}</b> / ${fmt1(total())}`;if(tcs!==lastTc){lastTc=tcs;$('tc').innerHTML=tcs}
  if(!E.playing)scheduleSave();
}
let lastTc='';
function selBox(x,y,w,h){g.strokeStyle='#fff';g.lineWidth=Math.max(2,cv.width/300);g.setLineDash([12,8]);g.strokeRect(x,y,w,h);g.setLineDash([])}
function drawMain(m,t,W,H){
  const [sw,sh]=srcSize(m),a=fadeAmt(m,t);if(a<=0)return;const fx=m.fx||{},p=clamp((t-m.start)/Math.max(0.01,m.dur),0,1);
  const z=fx.zoom?1+0.14*p:1;let ox=0,oy=0;if(fx.shake){ox=(Math.sin(t*37)+Math.sin(t*23)*.7)*W*0.006;oy=(Math.cos(t*29)+Math.sin(t*17)*.6)*H*0.005}
  g.globalAlpha=a;
  if(m.fit==='blur'){blurC.width=Math.max(8,Math.round(W/24));blurC.height=Math.max(8,Math.round(H/24));const s2=Math.max(blurC.width/sw,blurC.height/sh);
    try{bctx.drawImage(m.el,(blurC.width-sw*s2)/2,(blurC.height-sh*s2)/2,sw*s2,sh*s2)}catch(e){}g.imageSmoothingEnabled=true;g.drawImage(blurC,-W*.05,-H*.05,W*1.1,H*1.1);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(0,0,W,H)}
  const sc=(m.fit==='fit'||m.fit==='blur'?Math.min(W/sw,H/sh):Math.max(W/sw,H/sh))*z,dw=sw*sc,dh=sh*sc;
  g.filter=filterFor(m)||'none';try{g.drawImage(m.el,(W-dw)/2+ox,(H-dh)/2+oy,dw,dh)}catch(e){}g.filter='none';g.globalAlpha=1;
  if(fx.vignette){const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.55);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.72)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
  if(fx.grain){noisePat=noisePat||g.createPattern(noiseC,'repeat');const f=Math.floor(t*24);g.save();g.globalAlpha=.09;g.translate(-rnd(f)*160,-rnd(f+7)*160);g.fillStyle=noisePat;g.fillRect(0,0,W+160,H+160);g.restore()}

    h+=`<div class="tab" data-tab="basic">`+(it.kind==='video'?rng('sVol','Volume',0,200,Math.round(it.vol*100),Math.round(it.vol*100)+'%')+speedHtml(it):rng('sDur','Show for',5,300,Math.round(it.dur*10),secs(it.dur*10)))+
      `<span class="lbl">Frame</span>`+pillsHtml('sFit',FITS,it.fit||'fill')+fadeHtml(it)+`</div>`;
    h+=`<div class="tab" data-tab="look" hidden>`+pillsHtml('sLook',Object.fromEntries(Object.entries(LOOKS).map(([k,v])=>[k,v.n])),it.look)+rng('sBr','Brightness',50,150,it.br,it.br+'%')+rng('sCt','Contrast',50,150,it.ct,it.ct+'%')+rng('sSa','Colour',0,200,it.sa,it.sa+'%')+`<div class="row2"><button id="sAll">Use this look on all clips</button></div></div>`;
    h+=`<div class="tab" data-tab="fx" hidden>`+togglesHtml('sFx',FX,it.fx||{})+`<p class="hint">Tap to turn effects on or off. You can mix them.</p></div>`}
  if(it.track==='audio'){h+=rng('sVol','Volume',0,200,Math.round(it.vol*100),Math.round(it.vol*100)+'%')+fadeHtml(it)}
  const sh=$('sheet');sh.innerHTML=h;sh.hidden=false;$('shDone').onclick=closeSheet;
  let pushed=false;const once=()=>{if(!pushed){pushHist();pushed=true}};
  const bind=(id,fn,fmtV)=>{const el=$(id);if(!el)return;el.addEventListener('input',()=>{once();fn(+el.value);const v=$(id+'V');if(v)v.textContent=fmtV?fmtV(+el.value):el.value;syncMedia(false);draw()});el.addEventListener('change',()=>{renderTimeline();scheduleSave()})};
  const pct=v=>v+'%';
  bind('sSize',v=>it.size=v);bind('sScale',v=>it.scale=v/100,pct);bind('sOp',v=>it.op=v/100,pct);bind('sVol',v=>it.vol=v/100,pct);
  bind('sDur',v=>it.dur=v/10,secs);bind('sFi',v=>it.fi=Math.min(v/10,it.dur/2),secs);bind('sFo',v=>it.fo=Math.min(v/10,it.dur/2),secs);
  bind('sBr',v=>it.br=v,pct);bind('sCt',v=>it.ct=v,pct);bind('sSa',v=>it.sa=v,pct);
  if($('sTxt')){$('sTxt').addEventListener('input',e=>{once();it.text=e.target.value;draw()});$('sTxt').addEventListener('change',renderTimeline)}
  const pills=(id,fn)=>{const box=$(id);if(!box)return;box.querySelectorAll('button').forEach(b=>b.onclick=()=>{once();fn(b.dataset.v,b);box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));syncMedia(false);draw();scheduleSave()})};
  pills('sStyle',v=>it.style=v);pills('sAnim',v=>{it.anim=v;E.t=it.start;scrollToT(E.t);play()});pills('sLook',v=>it.look=v);pills('sFit',v=>it.fit=v);
  pills('sSpeed',v=>{const ns=+v,os=it.speed||1;it.dur=it.dur*os/ns;it.speed=ns;afterChange()});
  const fxBox=$('sFx');if(fxBox)fxBox.querySelectorAll('button').forEach(b=>b.onclick=()=>{once();it.fx={...(it.fx||{}),[b.dataset.v]:!(it.fx||{})[b.dataset.v]};b.setAttribute('aria-pressed',!!it.fx[b.dataset.v]);draw();scheduleSave()});

}

let vr=null,vrParts=[],vrStream=null,vrStart=0;
function openVoice(){
  const sh=$('sheet');sh.innerHTML=`<div class="hd"><b>Voiceover</b><button class="done" id="shDone">Close</button></div>
  <p class="hint">Recording starts from the white line and your video plays while you talk. Use earphones for clean sound.</p>

async function startVoice(){
  try{vrStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast('The microphone is blocked. Allow it for this site in Safari settings.');return}
  if(!window.MediaRecorder){toast('This browser cannot record. Use Safari or Chrome.');return}
  const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  vr=new MediaRecorder(vrStream,mt?{mimeType:mt}:undefined);vrParts=[];vr.ondataavailable=e=>e.data.size&&vrParts.push(e.data);
  vrStart=E.t;E.recording=true;$('vrBtn').classList.add('on');$('vrBtn').setAttribute('aria-label','Stop recording');
  vr.start(500);
  if(E.items.length){play()}else{clock0=performance.now();t0=E.t;E.playing=true;raf=requestAnimationFrame(step)}}
async function stopVoice(){
  if(!vr)return;const r=vr;vr=null;E.recording=false;
  await new Promise(res=>{r.onstop=res;r.stop()});vrStream.getTracks().forEach(t=>t.stop());pause();E.playing=false;cancelAnimationFrame(raf);setPlayIcon(false);
  const btn=$('vrBtn');if(btn){btn.classList.remove('on');btn.setAttribute('aria-label','Start recording')}
  const type=r.mimeType||'audio/mp4',ext=type.includes('mp4')?'m4a':'webm';
  const f=new File(vrParts,`voiceover.${ext}`,{type});if(f.size<2000){toast('Nothing was recorded');return}
  const ok=await addAudio(f,'Voiceover',vrStart);if(ok){toast('Voiceover added');closeSheet()}}

/* ---------- Sound effects library (made here, free to use anywhere) ---------- */
const SR=44100;
function noiseBuf(c,dur){const b=c.createBuffer(1,Math.ceil(SR*dur),SR),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function env(c,node,pts){const gn=c.createGain();gn.gain.setValueAtTime(0,0);pts.forEach(([t,v])=>gn.gain.linearRampToValueAtTime(v,t));node.connect(gn);return gn}
function noiseSrc(c,dur,at=0){const s=c.createBufferSource();s.buffer=noiseBuf(c,dur);s.start(at);return s}
function thump(c,out,at,f=60,len=.18,vol=1){const o=c.createOscillator();o.frequency.setValueAtTime(f*1.6,at);o.frequency.exponentialRampToValueAtTime(f,at+len*.6);const gn=c.createGain();gn.gain.setValueAtTime(0,at);gn.gain.linearRampToValueAtTime(vol,at+.01);gn.gain.exponentialRampToValueAtTime(.001,at+len);o.connect(gn).connect(out);o.start(at);o.stop(at+len+.05)}
function click(c,out,at,freq=3000,len=.02,vol=.8){const s=noiseSrc(c,len+.02,at),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=2;const gn=c.createGain();gn.gain.setValueAtTime(vol,at);gn.gain.exponentialRampToValueAtTime(.001,at+len);s.connect(bp).connect(gn).connect(out)}
const SFX=[
  {id:'hit',n:'Suspense hit',d:2.2,mk(c,o){thump(c,o,0,42,2,1);const s=noiseSrc(c,.6),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;env(c,s.connect(lp),[[.01,.7],[.5,0]]).connect(o)}},
  {id:'whoosh',n:'Whoosh',d:1,mk(c,o){const s=noiseSrc(c,1),bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(300,0);bp.frequency.exponentialRampToValueAtTime(3500,.45);bp.frequency.exponentialRampToValueAtTime(400,.95);env(c,s.connect(bp),[[.4,1],[.95,0]]).connect(o)}},
  {id:'heart',n:'Heartbeat',d:2.4,mk(c,o){[0,.28,1.1,1.38].forEach((t,i)=>thump(c,o,t,55,.22,i%2?.6:1))}},
  {id:'riser',n:'Tension riser',d:3,mk(c,o){const os=c.createOscillator();os.type='sawtooth';os.frequency.setValueAtTime(110,0);os.frequency.exponentialRampToValueAtTime(880,2.9);const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;os.connect(lp);env(c,lp,[[2.8,.35],[3,0]]).connect(o);os.start(0);os.stop(3);
    const s=noiseSrc(c,3),hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=2000;env(c,s.connect(hp),[[2.8,.5],[3,0]]).connect(o)}},
  {id:'drone',n:'Dark drone (music bed)',d:12,mk(c,o){[55,55.6,82.4].forEach((f,i)=>{const os=c.createOscillator();os.type=i===2?'triangle':'sine';os.frequency.value=f;env(c,os,[[2,i===2?.12:.35],[10,i===2?.12:.35],[12,0]]).connect(o);os.start(0);os.stop(12)});
    const s=noiseSrc(c,12),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;env(c,s.connect(lp),[[3,.15],[10,.15],[12,0]]).connect(o)}},
  {id:'type',n:'Typewriter',d:2,mk(c,o){let t=.02;while(t<1.8){click(c,o,t,2500+Math.random()*1500,.025,.9);t+=.08+Math.random()*.12}click(c,o,1.85,1200,.15,.6)}},
  {id:'shutter',n:'Camera shutter',d:.5,mk(c,o){click(c,o,0,3500,.03,1);click(c,o,.09,2200,.05,.8)}},
  {id:'tick',n:'Clock ticking',d:6,mk(c,o){for(let i=0;i<6;i++)click(c,o,i,i%2?4200:5200,.02,.9)}},
  {id:'glitch',n:'Glitch zap',d:.6,mk(c,o){const os=c.createOscillator();os.type='square';for(let i=0;i<12;i++)os.frequency.setValueAtTime(100+Math.random()*1400,i*.045);env(c,os,[[.01,.25],[.5,.2],[.6,0]]).connect(o);os.start(0);os.stop(.6)}},
  {id:'thunder',n:'Thunder rumble',d:4.5,mk(c,o){const s=noiseSrc(c,4.5),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=350;env(c,s.connect(lp),[[.05,1],[.4,.5],[.8,.9],[2,.4],[4.4,0]]).connect(o)}},
  {id:'knock',n:'Door knock',d:1.4,mk(c,o){[0,.22,.44].forEach(t=>{thump(c,o,t,120,.12,.9);click(c,o,t,900,.04,.5)})}},
  {id:'drop',n:'Bass drop',d:2,mk(c,o){const os=c.createOscillator();os.frequency.setValueAtTime(180,0);os.frequency.exponentialRampToValueAtTime(30,1.6);env(c,os,[[.02,1],[1.9,0]]).connect(o);os.start(0);os.stop(2)}},
];
const sfxCache={};
async function renderSfx(s){if(sfxCache[s.id])return sfxCache[s.id];const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const c=new OC(1,Math.ceil(SR*s.d),SR);
  const out=c.createGain();out.connect(c.destination);s.mk(c,out);const b=await c.startRendering();
  const d=b.getChannelData(0);let p=0;for(let i=0;i<d.length;i++)p=Math.max(p,Math.abs(d[i]));if(p>0)for(let i=0;i<d.length;i++)d[i]*=0.9/p;return sfxCache[s.id]=b}
function wavBlob(b){const n=b.length,d=b.getChannelData(0),ab=new ArrayBuffer(44+n*2),v=new DataView(ab),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=clamp(d[i],-1,1);v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}return new Blob([ab],{type:'audio/wav'})}
let pvCtx=null,pvSrc=null;
function openSfx(){
  const sh=$('sheet');sh.innerHTML=`<div class="hd"><b>Sound effects</b><button class="done" id="shDone">Close</button></div><p class="hint">Made by Fancut, free to use in any video. Added at the white line.</p><div class="sfx">`+
    SFX.map(s=>`<div class="sfxrow"><button class="pbtn" data-p="${s.id}" aria-label="Play ${s.n}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button><div><b>${s.n}</b><span>${s.d<1?s.d.toFixed(1):Math.round(s.d)}s</span></div><button class="addb" data-a="${s.id}">Add</button></div>`).join('')+'</div>';
  sh.hidden=false;$('shDone').onclick=()=>{if(pvSrc)try{pvSrc.stop()}catch(e){};closeSheet()};
  sh.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{const s=SFX.find(x=>x.id===b.dataset.p);pvCtx=pvCtx||new (window.AudioContext||window.webkitAudioContext)();pvCtx.resume();
    if(pvSrc)try{pvSrc.stop()}catch(e){}const buf=await renderSfx(s);pvSrc=pvCtx.createBufferSource();pvSrc.buffer=buf;pvSrc.connect(pvCtx.destination);pvSrc.start()});
  sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const s=SFX.find(x=>x.id===b.dataset.a);b.disabled=true;const buf=await renderSfx(s);
    const ok=await addAudio(new File([wavBlob(buf)],s.n+'.wav',{type:'audio/wav'}),s.n);b.disabled=false;if(ok){toast(s.n+' added');closeSheet()}});
}

/* ---------- Export ---------- */
$('expBtn').onclick=async()=>{
  if(!E.items.length)return;if(!window.MediaRecorder||!cv.captureStream){toast('This browser cannot export. Open Fancut in Safari or Chrome.');return}
  ensureAudio();if(actx)actx.resume().catch(()=>{});pause();closeSheet();
  const keepSel=E.sel;E.sel=null;E.exporting=true;setCanvasSize();$('expBox').hidden=false;$('expBar').style.width='0';
  E.t=0;syncMedia(false);draw();await new Promise(r=>setTimeout(r,300));
  const stream=cv.captureStream(30);if(recDest)recDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mt=bestType(),r=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:8e6}:undefined),parts=[];let cancelled=false;
  r.ondataavailable=ev=>ev.data.size&&parts.push(ev.data);
  const finished=new Promise(res=>{exportStop=()=>{exportStop=null;res()};$('expCancel').onclick=()=>{cancelled=true;if(exportStop)exportStop()}});
  r.start(500);play();await finished;
  E.playing=false;setPlayIcon(false);cancelAnimationFrame(raf);syncMedia(false);
  await new Promise(res=>{r.onstop=res;r.stop()});stream.getVideoTracks().forEach(t=>t.stop());
  E.exporting=false;setCanvasSize();E.sel=keepSel;$('expBox').hidden=true;draw();
  if(cancelled){toast('Export cancelled');return}
  const type=r.mimeType||'video/mp4';const res=await deliver(new Blob(parts,{type}),`fancut-${Date.now()}.${type.includes('mp4')?'mp4':'webm'}`);
  toast(doneMsg[res]||'Done.');
};

/* ---------- Get the audio ---------- */
let actx2=null,buf=null,asrc=null,aName='audio';
const ac=()=>actx2||(actx2=new (window.AudioContext||window.webkitAudioContext)());
$('vid').onchange=async e=>{const f=e.target.files[0];if(!f)return;aName=f.name.replace(/\.[^.]+$/,'')||'audio';
  $('aWork').hidden=false;$('status').textContent='Reading the sound…';
  try{const ab=await f.arrayBuffer();buf=await new Promise((res,rej)=>ac().decodeAudioData(ab,res,rej));$('cutS').value=0;$('cutE').value=0;cutInfo();$('status').textContent=''}
  catch(err){buf=null;$('status').textContent='No sound could be read from this file. Try another video.'}};
function aRange(){const d=buf.duration,s=$('cutS').value/1000*d*0.5,e=d-$('cutE').value/1000*d*0.5;return [s,Math.max(s+0.1,e)]}
function cutInfo(){if(!buf)return;const [s,e]=aRange();$('cutSV').textContent=s.toFixed(1)+'s';$('cutEV').textContent=(buf.duration-e).toFixed(1)+'s';
  $('tStart').textContent=fmt(s);$('tEnd').textContent=fmt(e);$('tLen').textContent='Keeping '+fmt(e-s);drawWave(s,e)}
['cutS','cutE'].forEach(i=>$(i).addEventListener('input',cutInfo));
function drawWave(s,e){const c=$('wave'),wg=c.getContext('2d'),W=c.width,H=c.height,d=buf.getChannelData(0),stepN=Math.ceil(d.length/W),cs=getComputedStyle(document.documentElement);
  wg.clearRect(0,0,W,H);for(let x=0;x<W;x++){let mn=1,mx=-1;for(let j=x*stepN;j<(x+1)*stepN&&j<d.length;j+=8){const q=d[j];if(q<mn)mn=q;if(q>mx)mx=q}
    const t=x/W*buf.duration;wg.fillStyle=(t>=s&&t<=e)?cs.getPropertyValue('--wave-on'):cs.getPropertyValue('--wave');wg.fillRect(x,(1-mx)*H/2,1,Math.max(1,(mx-mn)*H/2))}}
function mono(s,e){const sr=buf.sampleRate,a=Math.floor(s*sr),b=Math.floor(e*sr),out=new Float32Array(b-a),n=buf.numberOfChannels;
  for(let c=0;c<n;c++){const d=buf.getChannelData(c);for(let i=0;i<out.length;i++)out[i]+=d[a+i]/n}return out}
function gainFor(m){let p=0;for(let i=0;i<m.length;i++){const q=Math.abs(m[i]);if(q>p)p=q}return p>0?Math.min(4,0.95/p):1}
$('play').onclick=()=>{if(!buf)return;if(asrc){asrc.stop();asrc=null;$('play').textContent='Play';return}
  const [s,e]=aRange();asrc=ac().createBufferSource();asrc.buffer=buf;const gn=ac().createGain();gn.gain.value=$('norm').checked?gainFor(mono(s,e)):1;
  asrc.connect(gn).connect(ac().destination);asrc.onended=()=>{asrc=null;$('play').textContent='Play'};ac().resume();asrc.start(0,s,e-s);$('play').textContent='Stop'};
$('export').onclick=async()=>{
  if(!buf)return;if(!window.lamejs){$('status').textContent='The MP3 maker did not load. Check your internet and reload.';return}
  $('export').disabled=true;$('barBox').hidden=false;$('status').textContent='Making your MP3…';
  const [s,e]=aRange(),m=mono(s,e),gain=$('norm').checked?gainFor(m):1;
  const pcm=new Int16Array(m.length);for(let i=0;i<m.length;i++){const q=Math.max(-1,Math.min(1,m[i]*gain));pcm[i]=q<0?q*0x8000:q*0x7fff}
  const enc=new lamejs.Mp3Encoder(1,buf.sampleRate,128),parts=[],block=1152*40;
  for(let i=0;i<pcm.length;i+=block){const o=enc.encodeBuffer(pcm.subarray(i,i+block));if(o.length)parts.push(new Uint8Array(o));$('bar').style.width=Math.round(i/pcm.length*100)+'%';await tick0()}
  const end=enc.flush();if(end.length)parts.push(new Uint8Array(end));$('bar').style.width='100%';
  $('status').textContent=doneMsg[await deliver(new Blob(parts,{type:'audio/mpeg'}),aName+'.mp3')]||'Done.';$('export').disabled=false;
};
