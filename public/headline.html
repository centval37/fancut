<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fancut - Headline template</title>
<style>
  body{margin:0 auto;font-family:system-ui,sans-serif;background:#111;color:#fff;padding:16px;max-width:520px}
  canvas{width:100%;border-radius:12px;background:#222;display:block;margin-bottom:12px}
  input[type=text]{width:100%;padding:12px;font-size:18px;border-radius:10px;border:0;margin-bottom:10px;box-sizing:border-box}
  label,button{display:block;width:100%;padding:14px;margin-bottom:10px;border-radius:10px;border:0;font-size:16px;text-align:center;box-sizing:border-box;cursor:pointer}
  label{background:#333;color:#fff}
  button{background:#ff6a2b;color:#fff;font-weight:700}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<input type="text" id="word" value="SACKED" maxlength="30" placeholder="Type your headline">
<label>Add your photo<input type="file" id="file" accept="image/*" hidden></label>
<button id="dl">Download PNG</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const word=document.getElementById('word'),file=document.getElementById('file');
let img=null;
const FONT='Impact, "Arial Black", sans-serif';
function draw(){
  const W=c.width,H=c.height;
  x.fillStyle='#222';x.fillRect(0,0,W,H);
  if(img){
    const s=Math.max(W/img.width,H/img.height);
    const w=img.width*s,h=img.height*s;
    x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  }
  const g=x.createLinearGradient(0,H*0.6,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.9)');
  x.fillStyle=g;x.fillRect(0,H*0.6,W,H*0.4);
  const t=word.value.toUpperCase();
  let size=260;
  x.font=size+'px '+FONT;
  while(x.measureText(t).width>W*0.88&&size>40){
    size-=4;x.font=size+'px '+FONT;
  }
  x.fillStyle='#fff';x.textAlign='center';
  x.fillText(t,W/2,H-80);
}
file.onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const i=new Image();
  i.onload=()=>{img=i;draw();};
  i.src=URL.createObjectURL(f);
};
word.oninput=draw;
document.getElementById('dl').onclick=()=>{
  const a=document.createElement('a');
  a.download='headline.png';
  a.href=c.toDataURL('image/png');
  a.click();
};
draw();
</script>
</body>
</html>
